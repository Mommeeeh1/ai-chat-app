# Development Docker Compose Configuration
# This file is optimized for local development with hot-reload

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ai-trainer-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aitrainer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aitrainer_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-aitrainer_dev}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aitrainer}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ai-trainer-dev-network

  # Redis (for rate limiting and caching)
  redis:
    image: redis:7-alpine
    container_name: ai-trainer-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_dev_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ai-trainer-dev-network

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local

networks:
  ai-trainer-dev-network:
    driver: bridge

