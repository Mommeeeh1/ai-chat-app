services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ai-trainer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aitrainer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aitrainer_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-aitrainer}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aitrainer}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-trainer-network

  # Redis (for rate limiting and caching)
  redis:
    image: redis:7-alpine
    container_name: ai-trainer-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-trainer-network

  # Backend API
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: ai-trainer-api
    restart: unless-stopped
    environment:
      # Server
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${API_PORT:-3000}
      HOST: ${API_HOST:-0.0.0.0}
      
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-aitrainer}:${POSTGRES_PASSWORD:-aitrainer_secure_password}@postgres:5432/${POSTGRES_DB:-aitrainer}?schema=public
      
      # Security
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      
      # CORS
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      
      # Rate Limiting
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      
      # Redis
      REDIS_URL: redis://redis:6379
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Running database migrations...' &&
        npx prisma migrate deploy || echo 'Migration failed or already applied' &&
        echo 'Seeding database...' &&
        npx prisma db seed || echo 'Seed failed or already seeded' &&
        echo 'Starting server...' &&
        node dist/server.js
      "
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - ai-trainer-network

  # Frontend (Next.js)
  frontend:
    build:
      context: ./ai-trainer-frontend
      dockerfile: Dockerfile
    container_name: ai-trainer-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - ai-trainer-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  ai-trainer-network:
    driver: bridge

