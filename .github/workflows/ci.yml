name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ============================================
  # CODE QUALITY CHECKS
  # ============================================
  lint-and-typecheck:
    name: Code Quality (Lint & Type Check)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: |
          api/package-lock.json
          ai-trainer-frontend/package-lock.json

    # Backend Linting
    - name: Install API dependencies
      working-directory: ./api
      run: npm ci

    - name: Run ESLint (API)
      working-directory: ./api
      run: npm run lint

    - name: Check code formatting (API)
      working-directory: ./api
      run: npm run format:check

    - name: TypeScript type check (API)
      working-directory: ./api
      run: npm run type-check

    # Frontend Linting
    - name: Install Frontend dependencies
      working-directory: ./ai-trainer-frontend
      run: npm ci

    - name: Run ESLint (Frontend)
      working-directory: ./ai-trainer-frontend
      run: npm run lint

    - name: TypeScript type check (Frontend)
      working-directory: ./ai-trainer-frontend
      run: npx tsc --noEmit

  # ============================================
  # UNIT TESTS
  # ============================================
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: api/package-lock.json

    - name: Install dependencies
      working-directory: ./api
      run: npm ci

    - name: Generate Prisma Client
      working-directory: ./api
      run: npx prisma generate

    - name: Run tests
      working-directory: ./api
      run: npm test

    - name: Generate test coverage
      working-directory: ./api
      run: npm run test:coverage

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./api/coverage/coverage-final.json
        flags: backend
        name: backend-coverage
        fail_ci_if_error: false

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ai-trainer-frontend/package-lock.json

    - name: Install dependencies
      working-directory: ./ai-trainer-frontend
      run: npm ci

    - name: Run tests
      working-directory: ./ai-trainer-frontend
      run: npm test

    - name: Generate test coverage
      working-directory: ./ai-trainer-frontend
      run: npm run test:coverage

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./ai-trainer-frontend/coverage/coverage-final.json
        flags: frontend
        name: frontend-coverage
        fail_ci_if_error: false

  # ============================================
  # DOCKER BUILD & INTEGRATION TESTS
  # ============================================
  docker-build-test:
    name: Docker Build & Integration Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Create .env file for testing
      run: |
        cat > .env << EOF
        NODE_ENV=test
        POSTGRES_USER=aitrainer
        POSTGRES_PASSWORD=test_password_123
        POSTGRES_DB=aitrainer_test
        JWT_SECRET=test_jwt_secret_for_ci_minimum_32_characters_long_12345
        OPENAI_API_KEY=sk-test-key-for-ci-testing-only
        CORS_ORIGIN=http://localhost:3001
        OPENAI_MODEL=gpt-3.5-turbo
        OPENAI_MAX_TOKENS=500
        RATE_LIMIT_WINDOW_MS=900000
        RATE_LIMIT_MAX_REQUESTS=100
        REDIS_URL=redis://redis:6379
        LOG_LEVEL=info
        NEXT_PUBLIC_API_URL=http://localhost:3000
        EOF

    - name: Build Docker images
      run: docker-compose build

    - name: Start services
      run: docker-compose up -d

    - name: Wait for PostgreSQL
      run: |
        timeout 60 bash -c 'until docker-compose exec -T postgres pg_isready -U aitrainer; do sleep 2; done'

    - name: Wait for Redis
      run: |
        timeout 30 bash -c 'until docker-compose exec -T redis redis-cli ping | grep PONG; do sleep 2; done'

    - name: Wait for API health
      run: |
        timeout 120 bash -c 'until curl -f http://localhost:3000/health; do sleep 5; done'

    - name: Wait for Frontend
      run: |
        timeout 120 bash -c 'until curl -f http://localhost:3001 > /dev/null 2>&1; do sleep 5; done'

    - name: Run integration tests (API)
      run: docker-compose exec -T api npm test

    - name: Run integration tests (Frontend)
      run: docker-compose exec -T frontend npm test || true

    - name: Verify API health endpoint
      run: |
        response=$(curl -s http://localhost:3000/health)
        echo "$response" | grep -q "ok" || exit 1
        echo "✅ API health check passed"

    - name: Verify Frontend is serving
      run: |
        response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001)
        [ "$response" = "200" ] || exit 1
        echo "✅ Frontend is serving correctly"

    - name: View logs on failure
      if: failure()
      run: |
        echo "=== API Logs ==="
        docker-compose logs api || true
        echo "=== Frontend Logs ==="
        docker-compose logs frontend || true
        echo "=== Database Logs ==="
        docker-compose logs postgres || true

    - name: Stop services
      if: always()
      run: docker-compose down -v

  # ============================================
  # SECURITY SCANNING
  # ============================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner (API)
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: './api'
        format: 'sarif'
        output: 'trivy-api-results.sarif'
        severity: 'CRITICAL,HIGH'

    - name: Run Trivy vulnerability scanner (Frontend)
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: './ai-trainer-frontend'
        format: 'sarif'
        output: 'trivy-frontend-results.sarif'
        severity: 'CRITICAL,HIGH'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-api-results.sarif,trivy-frontend-results.sarif'

  # ============================================
  # BUILD VERIFICATION
  # ============================================
  build-verification:
    name: Build Verification
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: |
          api/package-lock.json
          ai-trainer-frontend/package-lock.json

    - name: Build API
      working-directory: ./api
      run: |
        npm ci
        npx prisma generate
        npm run build

    - name: Build Frontend
      working-directory: ./ai-trainer-frontend
      run: |
        npm ci
        npm run build

