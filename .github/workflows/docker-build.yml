name: Docker Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Create .env file
      run: |
        cat > .env << EOF
        NODE_ENV=test
        POSTGRES_USER=aitrainer
        POSTGRES_PASSWORD=test_password
        POSTGRES_DB=aitrainer_test
        JWT_SECRET=test_jwt_secret_for_ci_minimum_32_characters_long
        OPENAI_API_KEY=sk-test-key-for-ci
        CORS_ORIGIN=http://localhost:3001
        EOF

    - name: Build Docker images
      run: docker-compose build

    - name: Start services
      run: docker-compose up -d

    - name: Wait for services to be healthy
      run: |
        timeout 120 bash -c 'until curl -f http://localhost:3000/health; do sleep 5; done'
        timeout 120 bash -c 'until curl -f http://localhost:3001; do sleep 5; done'

    - name: Run API tests
      run: docker-compose exec -T api npm test

    - name: Run Frontend tests
      run: docker-compose exec -T frontend npm test

    - name: Check API health
      run: curl -f http://localhost:3000/health

    - name: Check Frontend health
      run: curl -f http://localhost:3001

    - name: View logs on failure
      if: failure()
      run: |
        echo "=== API Logs ==="
        docker-compose logs api
        echo "=== Frontend Logs ==="
        docker-compose logs frontend
        echo "=== Database Logs ==="
        docker-compose logs postgres

    - name: Stop services
      if: always()
      run: docker-compose down -v

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner (API)
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: './api'
        format: 'sarif'
        output: 'trivy-api-results.sarif'

    - name: Run Trivy vulnerability scanner (Frontend)
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: './ai-trainer-frontend'
        format: 'sarif'
        output: 'trivy-frontend-results.sarif'

    - name: Upload Trivy results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: '.'

